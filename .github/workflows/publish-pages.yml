name: Verify Quartz content publication

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'quartz/**'
      - 'package.json'
      - 'package-lock.json'
      - 'quartz.config.ts'
      - 'quartz.layout.ts'
  workflow_dispatch:

concurrency:
  group: quartz-content-publication
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx quartz build
